<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0821">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VinylVault feat. DJ Lloyd</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-deep: #090518;
      --bg-panel: #130b2e;
      --bg-card: #19183d;
      --bg-input: #0c0721;
      --border-subtle: rgba(139, 92, 246, 0.3);
      --border-amber: rgba(245, 158, 11, 0.58);
      --purple: #8b5cf6;
      --purple-neon: #a855f7;
      --blue-neon: #38bdf8;
      --amber: #f59e0b;
      --amber-glow: #fbbf24;
      --emerald: #10b981;
      --rose: #43f5fe;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: linear-gradient(180deg, #0c0722 0%, #070412 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .hidden { display: none !important; }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #10092b;
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 10px;
      font-weight: 800;
      color: var(--amber-glow);
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-pill {
      background: #1a1140;
      border: 1px solid var(--border-amber);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      color: var(--amber-glow);
      white-space: nowrap;
    }
    .icon-btn {
      background: #1a1140;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    main {
      padding: 16px 14px 100px 14px;
      max-width: 600px;
      margin: 0 auto;
    }
    .tab-view { display: none; }
    .tab-view.active { display: block; }
    h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .kallax-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .kube {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px;
    }
    .input-group {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash" onclick="this.classList.add('hidden')">
    <img src="splash.gif" alt="VinylVault feat. DJ Lloyd" style="width:100%;max-width:420px;height:100dvh;object-fit:cover;">
  </div>

  <header>
    <div class="brand">
      <img src="icon.jpg" alt="DJ Lloyd" style="width:42px;height:42px;border-radius:12px;object-fit:cover;object-position:center 68%;border:1.5px solid var(--amber);">
      <div>
        <div class="brand-title">VinylVault</div>
        <div class="brand-sub">Feat. DJ Lloyd</div>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-pill" id="stats-pill">0 dischi • € 0</div>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <main>
    <div id="view-kallax" class="tab-view active">
      <h2>Scaffale Kallax</h2>
      <div class="kallax-grid" id="kallax-container"></div>
    </div>
  </main>

  <script>
    const state = {
      inventory: [],
      wishlist: [],
      settings: { discogsToken: "XSiVCBoirlkKyeakEqUsPeyLbgcSvAoiEklLZAZQ", geminiKey: "" }
    };
    function updateStats() {
      const totalDiscs = state.inventory.reduce((sum, item) => sum + (parseInt(item.qty) || 1), 0);
      const totalValue = state.inventory.reduce((sum, item) => sum + ((parseFloat(item.price) || 0) * (parseInt(item.qty) || 1)), 0);
      document.getElementById('stats-pill').innerText = `${totalDiscs} dischi • € ${Math.round(totalValue)}`;
    }
    function initApp() {
      console.log("VinylVault Initialized");
      updateStats();
    }
    window.onload = initApp;
  </script>
</body>
</html>
