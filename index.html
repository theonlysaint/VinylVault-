<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0821">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VinylVault feat. DJ Lloyd</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.jpg">
  <style>
    :root {
      --bg-deep: #090518;
      --bg-panel: #130b2e;
      --bg-card: #19183d;
      --bg-input: #0c0721;
      --border-subtle: rgba(139, 92, 246, 0.3);
      --border-amber: rgba(245, 158, 11, 0.58);
      --purple: #8b5cf6;
      --purple-neon: #a855f7;
      --blue-neon: #38bdf8;
      --amber: #f59e0b;
      --amber-glow: #fbbf24;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: linear-gradient(180deg, #0c0722 0%, #070412 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .hidden { display: none !important; }

    /* SPLASH SCREEN CENTRATO E SENZA SBORDI */
    #splash {
      position: fixed; inset: 0; z-index: 9999; background: #090518;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      transition: opacity 0.4s ease;
    }
    #splash img {
      width: 100%;
      max-width: 390px;
      max-height: 92dvh;
      object-fit: contain;
      border-radius: 20px;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    /* HEADER CON ICONA CENTRATA */
    header {
      position: sticky; top: 0; z-index: 50; background: #10092b;
      border-bottom: 1px solid var(--border-subtle); padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 12px;
      object-fit: cover; object-position: center center;
      border: 1.5px solid var(--amber);
      background: #1a1140;
      flex-shrink: 0;
    }
    .brand-title { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.1; }
    .brand-sub { font-size: 10px; font-weight: 800; color: var(--amber-glow); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .stat-pill {
      background: #1a1140; border: 1px solid var(--border-amber); border-radius: 999px;
      padding: 5px 11px; font-size: 11px; font-weight: 700; color: var(--amber-glow);
    }
    .icon-btn {
      background: #1a1140; border: 1px solid var(--border-subtle); border-radius: 12px;
      color: var(--text-main); width: 38px; height: 38px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }

    main { padding: 16px 14px 96px 14px; max-width: 600px; margin: 0 auto; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h2 { font-size: 19px; font-weight: 800; }

    /* KALLAX */
    .kallax-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .kube {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 10px 8px; cursor: pointer; text-align: center;
    }
    .kube.selected { border-color: var(--amber); background: #23194d; }
    .kube-title { font-size: 13px; font-weight: 800; color: var(--amber-glow); }
    .kube-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .kube-bar { height: 4px; background: #0c0721; border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .kube-fill { height: 100%; background: var(--blue-neon); }

    /* CARDS & FORMS */
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--blue-neon); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border-subtle);
      border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 14px; margin-bottom: 12px;
      font-family: inherit;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; color: #fff; }
    .btn-primary { background: linear-gradient(90deg, var(--purple) 0%, var(--blue-neon) 100%); }
    .btn-amber { background: linear-gradient(90deg, var(--amber) 0%, #ea580c 100%); }
    .btn-sm { padding: 6px 10px; font-size: 12px; width: auto; }

    .pill-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .pill-tab {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border-subtle);
      color: var(--text-muted); padding: 8px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .pill-tab.active { background: var(--purple); color: #fff; border-color: var(--purple-neon); }

    /* VINYL ITEM CON COPERTINA */
    .vinyl-item {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 10px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .vinyl-cover {
      width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
      background: #0c0721; border: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .vinyl-info { flex: 1; min-width: 0; }
    .vinyl-info h4 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vinyl-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .badge {
      display: inline-block; background: #281d59; color: var(--amber-glow);
      font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; margin-top: 5px;
    }

    .lloyd-hero {
      display: flex; align-items: center; gap: 12px;
      background: linear
