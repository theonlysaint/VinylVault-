<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0821">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VinylVault feat. DJ Lloyd</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.jpg">
  <style>
    :root {
      --bg-deep: #090518;
      --bg-panel: #130b2e;
      --bg-card: #19183d;
      --bg-input: #0c0721;
      --border-subtle: rgba(139, 92, 246, 0.3);
      --border-amber: rgba(245, 158, 11, 0.58);
      --purple: #8b5cf6;
      --purple-neon: #a855f7;
      --blue-neon: #38bdf8;
      --amber: #f59e0b;
      --amber-glow: #fbbf24;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: linear-gradient(180deg, #0c0722 0%, #070412 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .hidden { display: none !important; }
    
    /* SPLASH SCREEN */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #090518;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #10092b;
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      object-position: center 68%;
      border: 1.5px solid var(--amber);
    }
    .brand-title { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.1; }
    .brand-sub { font-size: 10px; font-weight: 800; color: var(--amber-glow); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .stat-pill {
      background: #1a1140;
      border: 1px solid var(--border-amber);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      color: var(--amber-glow);
    }
    .icon-btn {
      background: #1a1140;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* MAIN */
    main { padding: 16px 14px 96px 14px; max-width: 600px; margin: 0 auto; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h2 { font-size: 19px; font-weight: 800; }

    /* KALLAX */
    .kallax-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .kube {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
    }
    .kube.selected { border-color: var(--amber); background: #23194d; }
    .kube-title { font-size: 13px; font-weight: 800; color: var(--amber-glow); }
    .kube-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .kube-bar { height: 4px; background: #0c0721; border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .kube-fill { height: 100%; background: var(--blue-neon); }

    /* CARDS & FORMS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--blue-neon); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      color: #fff;
    }
    .btn-primary { background: linear-gradient(90deg, var(--purple) 0%, var(--blue-neon) 100%); }
    .btn-amber { background: linear-gradient(90deg, var(--amber) 0%, #ea580c 100%); }
    .btn-sm { padding: 6px 10px; font-size: 12px; width: auto; }

    /* SUB-TABS */
    .pill-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .pill-tab {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .pill-tab.active { background: var(--purple); color: #fff; border-color: var(--purple-neon); }

    /* VINYL ITEM */
    .vinyl-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .vinyl-info h4 { font-size: 15px; font-weight: 700; }
    .vinyl-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .badge {
      display: inline-block;
      background: #281d59;
      color: var(--amber-glow);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      margin-top: 5px;
    }

    /* BOTTOM NAV */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #10092b;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--amber-glow); }
    .nav-btn span { font-size: 18px; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash" onclick="closeSplash()">
    <img src="splash.gif?v=2" alt="VinylVault feat. DJ Lloyd" style="width:100%;max-width:430px;height:100dvh;object-fit:cover;">
  </div>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <img src="icon.jpg?v=2" alt="DJ Lloyd" class="brand-icon">
      <div>
        <div class="brand-title">VinylVault</div>
        <div class="brand-sub">Feat. DJ Lloyd</div>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-pill" id="stats-pill">0 dischi • € 0</div>
      <button class="icon-btn" onclick="switchTab('settings')">⚙️</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: SCAFFALE KALLAX -->
    <div id="view-kallax" class="tab-view active">
      <div class="section-header">
        <h2>Scaffale Kallax</h2>
        <button class="btn btn-amber btn-sm" onclick="switchTab('add')">+ Aggiungi</button>
      </div>
      <div class="kallax-grid" id="kallax-grid"></div>
      <div class="card">
        <h3 id="selected-cube-title" style="color:var(--amber-glow);font-size:15px;margin-bottom:8px;">Cubo A1</h3>
        <div id="cube-discs-list"></div>
      </div>
    </div>

    <!-- TAB 2: COLLEZIONE & WISHLIST -->
    <div id="view-collection" class="tab-view">
      <div class="section-header">
        <h2>La Tua Collezione</h2>
        <button class="btn btn-amber btn-sm" onclick="switchTab('add')">+ Aggiungi</button>
      </div>
      <div class="pill-tabs">
        <button class="pill-tab active" id="sub-owned" onclick="setCollectionFilter('owned')">In Scaffale</button>
        <button class="pill-tab" id="sub-wish" onclick="setCollectionFilter('wish')">Wishlist Mercatini</button>
      </div>
      <input type="text" id="search-input" placeholder="Cerca per artista, titolo, genere o etichetta..." oninput="renderCollection()">
      <div id="collection-list"></div>
    </div>

    <!-- TAB 3: AGGIUNGI DISCO -->
    <div id="view-add" class="tab-view">
      <div class="section-header">
        <h2>Aggiungi Vinile</h2>
      </div>
      <div class="card">
        <label>Ricerca rapida Discogs</label>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="text" id="discogs-query" placeholder="Artista + Titolo album..." style="margin-bottom:0;">
          <button class="btn btn-primary btn-sm" onclick="searchDiscogs()">Cerca</button>
        </div>
        <div id="discogs-results"></div>
      </div>

      <div class="card">
        <label>Artista *</label>
        <input type="text" id="f-artist" placeholder="Es. Pink Floyd">
        <label>Titolo Album *</label>
        <input type="text" id="f-title" placeholder="Es. The Dark Side of the Moon">
        <div class="row-2">
          <div>
            <label>Genere</label>
            <input type="text" id="f-genre" placeholder="Rock, Jazz, House...">
          </div>
          <div>
            <label>Etichetta</label>
            <input type="text" id="f-label" placeholder="Harvest, Blue Note...">
          </div>
        </div>
        <div class="row-2">
          <div>
            <label>Cubo Kallax</label>
            <select id="f-cube">
              <option value="A1">Cubo A1</option>
              <option value="A2">Cubo A2</option>
              <option value="A3">Cubo A3</option>
              <option value="A4">Cubo A4</option>
              <option value="B1">Cubo B1</option>
              <option value="B2">Cubo B2</option>
              <option value="B3">Cubo B3</option>
              <option value="B4">Cubo B4</option>
            </select>
          </div>
          <div>
            <label>Stato</label>
            <select id="f-status">
              <option value="owned">In Scaffale</option>
              <option value="wish">Wishlist Mercatini</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div>
            <label>Prezzo / Valore (€)</label>
            <input type="number" id="f-price" placeholder="25" value="0">
          </div>
          <div>
            <label>Quantità</label>
            <input type="number" id="f-qty" value="1" min="1">
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveDisc()">Salva nel Vault</button>
      </div>
    </div>

    <!-- TAB 4: IMPOSTAZIONI & BACKUP -->
    <div id="view-settings" class="tab-view">
      <h2>Impostazioni & Backup</h2>
      <div class="card">
        <label>Discogs Personal Access Token</label>
        <input type="text" id="set-discogs" placeholder="Inserisci token Discogs">
        <button class="btn btn-primary" onclick="saveSettings()">Salva Impostazioni</button>
      </div>
      <div class="card">
        <label>Esporta / Importa Dati JSON</label>
        <button class="btn btn-amber" style="margin-bottom:10px;" onclick="exportData()">Scarica Backup JSON</button>
        <input type="file" id="import-file" accept=".json" onchange="importData(event)">
      </div>
    </div>
  </main>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-kallax" onclick="switchTab('kallax')"><span>🔲</span>Scaffale</button>
    <button class="nav-btn" id="nav-collection" onclick="switchTab('collection')"><span>📀</span>Collezione</button>
    <button class="nav-btn" id="nav-add" onclick="switchTab('add')"><span>➕</span>Aggiungi</button>
  </nav>

  <script>
    const CUBES = ['A1', 'A2', 'A3', 'A4', 'B1', 'B2', 'B3', 'B4'];
    let selectedCube = 'A1';
    let collectionFilter = 'owned';

    let state = JSON.parse(localStorage.getItem('vinylvault_data')) || {
      discs: [],
      discogsToken: 'XSiVCBoirlkKyeakEqUsPeyLbgcSvAoiEklLZAZQ'
    };

    function persist() {
      localStorage.setItem('vinylvault_data', JSON.stringify(state));
      updateStats();
    }

    function closeSplash() {
      const sp = document.getElementById('splash');
      if (sp) {
        sp.classList.add('fade-out');
        setTimeout(() => sp.classList.add('hidden'), 400);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tab).classList.add('active');
      const navBtn = document.getElementById('nav-' + tab);
      if (navBtn) navBtn.classList.add('active');

      if (tab === 'kallax') renderKallax();
      if (tab === 'collection') renderCollection();
      if (tab === 'settings') document.getElementById('set-discogs').value = state.discogsToken || '';
    }

    function updateStats() {
      const owned = state.discs.filter(d => d.status === 'owned');
      const count = owned.reduce((acc, d) => acc + (parseInt(d.qty) || 1), 0);
      const val = owned.reduce((acc, d) => acc + ((parseFloat(d.price) || 0) * (parseInt(d.qty) || 1)), 0);
      document.getElementById('stats-pill').innerText = `${count} dischi • € ${Math.round(val)}`;
    }

    function renderKallax() {
      const grid = document.getElementById('kallax-grid');
      grid.innerHTML = CUBES.map(c => {
        const count = state.discs.filter(d => d.status === 'owned' && d.cube === c).reduce((a, b) => a + (parseInt(b.qty) || 1), 0);
        const pct = Math.min(100, Math.round((count / 50) * 100));
        return `
          <div class="kube ${selectedCube === c ? 'selected' : ''}" onclick="selectCube('${c}')">
            <div class="kube-title">Cubo ${c}</div>
            <div class="kube-count">${count}/50</div>
            <div class="kube-bar"><div class="kube-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('');

      document.getElementById('selected-cube-title').innerText = `Cubo ${selectedCube}`;
      const list = document.getElementById('cube-discs-list');
      const cubeDiscs = state.discs.filter(d => d.status === 'owned' && d.cube === selectedCube);
      if (!cubeDiscs.length) {
        list.innerHTML = `<p style="font-size:12px;color:var(--text-muted);">Nessun vinile in questo cubo.</p>`;
      } else {
        list.innerHTML = cubeDiscs.map(d => renderDiscCard(d)).join('');
      }
    }

    function selectCube(c) {
      selectedCube = c;
      renderKallax();
    }

    function setCollectionFilter(f) {
      collectionFilter = f;
      document.getElementById('sub-owned').classList.toggle('active', f === 'owned');
      document.getElementById('sub-wish').classList.toggle('active', f === 'wish');
      renderCollection();
    }

    function renderCollection() {
      const q = (document.getElementById('search-input').value || '').toLowerCase();
      const filtered = state.discs.filter(d =>
        d.status === collectionFilter &&
        (`${d.artist} ${d.title} ${d.genre} ${d.label}`).toLowerCase().includes(q)
      );
      const container = document.getElementById('collection-list');
      if (!filtered.length) {
        container.innerHTML = `<div class="card" style="text-align:center;color:var(--text-muted);font-size:13px;">Nessun disco trovato.</div>`;
      } else {
        container.innerHTML = filtered.map(d => renderDiscCard(d)).join('');
      }
    }

    function renderDiscCard(d) {
      return `
        <div class="vinyl-item">
          <div class="vinyl-info">
            <h4>${d.artist} — ${d.title}</h4>
            <p>${d.genre || 'Genere N/D'} • ${d.label || 'Etichetta N/D'}</p>
            <span class="badge">${d.status === 'owned' ? 'Cubo ' + d.cube : 'Wishlist'} • € ${d.price || 0}</span>
          </div>
          <button class="icon-btn" style="color:var(--rose);" onclick="deleteDisc('${d.id}')">🗑️</button>
        </div>
      `;
    }

    function saveDisc() {
      const artist = document.getElementById('f-artist').value.trim();
      const title = document.getElementById('f-title').value.trim();
      if (!artist || !title) return alert('Inserisci almeno Artista e Titolo.');

      state.discs.unshift({
        id: Date.now().toString(),
        artist,
        title,
        genre: document.getElementById('f-genre').value.trim(),
        label: document.getElementById('f-label').value.trim(),
        cube: document.getElementById('f-cube').value,
        status: document.getElementById('f-status').value,
        price: parseFloat(document.getElementById('f-price').value) || 0,
        qty: parseInt(document.getElementById('f-qty').value) || 1
      });

      persist();
      document.getElementById('f-artist').value = '';
      document.getElementById('f-title').value = '';
      document.getElementById('f-genre').value = '';
      document.getElementById('f-label').value = '';
      switchTab('collection');
    }

    function deleteDisc(id) {
      if (!confirm('Eliminare questo vinile?')) return;
      state.discs = state.discs.filter(d => d.id !== id);
      persist();
      renderKallax();
      renderCollection();
    }

    async function searchDiscogs() {
      const q = document.getElementById('discogs-query').value.trim();
      if (!q) return;
      const resDiv = document.getElementById('discogs-results');
      resDiv.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">Ricerca su Discogs...</p>';
      try {
        const resp = await fetch(`https://api.discogs.com/database/search?q=${encodeURIComponent(q)}&type=release&format=vinyl&token=${state.discogsToken}`);
        const data = await resp.json();
        const items = (data.results || []).slice(0, 5);
        if (!items.length) {
          resDiv.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">Nessun risultato.</p>';
          return;
        }
        resDiv.innerHTML = items.map(item => {
          const parts = item.title.split(' - ');
          const artist = (parts[0] || '').replace(/'/g, "\\'");
          const title = (parts.slice(1).join(' - ') || item.title).replace(/'/g, "\\'");
          const genre = ((item.genre || [])[0] || '').replace(/'/g, "\\'");
          const label = ((item.label || [])[0] || '').replace(/'/g, "\\'");
          return `
            <div class="vinyl-item" style="cursor:pointer;" onclick="fillForm('${artist}','${title}','${genre}','${label}')">
              <div class="vinyl-info">
                <h4>${item.title}</h4>
                <p>${item.year || ''} • ${label}</p>
              </div>
              <span class="badge">Usa</span>
            </div>
          `;
        }).join('');
      } catch (e) {
        resDiv.innerHTML = '<p style="font-size:12px;color:var(--rose);">Errore connessione Discogs.</p>';
      }
    }

    function fillForm(artist, title, genre, label) {
      document.getElementById('f-artist').value = artist;
      document.getElementById('f-title').value = title;
      document.getElementById('f-genre').value = genre;
      document.getElementById('f-label').value = label;
      document.getElementById('discogs-results').innerHTML = '';
    }

    function saveSettings() {
      state.discogsToken = document.getElementById('set-discogs').value.trim();
      persist();
      alert('Impostazioni salvate!');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'vinylvault_backup.json';
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported.discs) {
            state = imported;
            persist();
            renderKallax();
            alert('Backup ripristinato!');
          }
        } catch {
          alert('File JSON non valido.');
        }
      };
      reader.readAsText(file);
    }

    window.onload = () => {
      updateStats();
      renderKallax();
      setTimeout(closeSplash, 2600);
    };
  </script>
</body>
</html>
